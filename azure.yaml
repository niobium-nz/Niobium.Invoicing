name: niobiuminvoicing

hooks:
  preprovision:
    shell: pwsh
    run: ./infra/scripts/SetAppSettings.ps1
  postprovision:
    - shell: pwsh
      run: ./infra/scripts/SetKeyVaultSecrets.ps1
    - shell: pwsh
      run: ./infra/scripts/ClearAppSettings.ps1

infra:
  provider: bicep
  layers:
    - name: niobiuminvoicing-infra
      path: ./infra

services:
  niobiuminvoicing:
    project: ./src/Niobium.Invoicing.Server
    language: csharp
    host: function
    hooks:
      prepackage:
        run: dotnet test --solution ../../Niobium.Invoicing.slnx --configuration Release

pipeline:
  provider: github