name: Package Publish

on:
  push:
    branches: ["*"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  
env:  
  nugetFeedUrl: "https://api.nuget.org/v3/index.json"
  nugetProjects: |
    src/Niobium.Invoicing.Contracts

jobs:
  pre-release:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pre-release-publish
      cancel-in-progress: true
    env:
      buildVersion: '${{ vars.MAJOR_VERSION }}.${{ vars.MINOR_VERSION }}.${{ github.run_number }}-prerelease'
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x.x'

    - name: Restore Packages
      run: dotnet restore

    - name: Build Projects
      run: dotnet build --configuration Release /p:BUILD_BUILDNUMBER=${{ env.buildVersion }}
      
    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    
    - name: NuGet Publish
      run: |
        set -euo pipefail

        if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
          comparisonBase="$BEFORE_SHA"

          if [[ "$comparisonBase" == "0000000000000000000000000000000000000000" ]]; then
            comparisonBase="$(git hash-object -t tree /dev/null)"
          else
            git fetch --no-tags --depth=1 origin "$comparisonBase"
          fi
        fi

        while IFS= read -r project; do
          [[ -z "$project" ]] && continue

          if [[ "$GITHUB_EVENT_NAME" == "push" ]] && git diff --quiet "$comparisonBase" "$GITHUB_SHA" -- "$project"; then
            echo "Skipping $project because it has no changes."
            continue
          fi

          echo "Publishing $project."
          dotnet nuget push "$project/bin/Release/*.nupkg" --source "$NUGET_FEED_URL" --api-key "$NUGET_API_KEY"
        done <<< "$NUGET_PROJECTS"
      env:
        BEFORE_SHA: ${{ github.event.before }}
        NUGET_FEED_URL: ${{ env.nugetFeedUrl }}
        NUGET_PROJECTS: ${{ env.nugetProjects }}
        NUGET_API_KEY: ${{steps.login.outputs.NUGET_API_KEY}}

  prod-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: prod-release-publish
      cancel-in-progress: true
    env:
      buildVersion: '${{ vars.MAJOR_VERSION }}.${{ vars.MINOR_VERSION }}.${{ github.run_number }}'
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x.x'

    - name: Restore Packages
      run: dotnet restore

    - name: Build Projects
      run: dotnet build --configuration Release /p:BUILD_BUILDNUMBER=${{ env.buildVersion }}
      
    - name: NuGet login (OIDC)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    
    - name: NuGet Publish
      run: |
        set -euo pipefail

        if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
          comparisonBase="$BEFORE_SHA"

          if [[ "$comparisonBase" == "0000000000000000000000000000000000000000" ]]; then
            comparisonBase="$(git hash-object -t tree /dev/null)"
          else
            git fetch --no-tags --depth=1 origin "$comparisonBase"
          fi
        fi

        while IFS= read -r project; do
          [[ -z "$project" ]] && continue

          if [[ "$GITHUB_EVENT_NAME" == "push" ]] && git diff --quiet "$comparisonBase" "$GITHUB_SHA" -- "$project"; then
            echo "Skipping $project because it has no changes."
            continue
          fi

          echo "Publishing $project."
          dotnet nuget push "$project/bin/Release/*.nupkg" --source "$NUGET_FEED_URL" --api-key "$NUGET_API_KEY"
        done <<< "$NUGET_PROJECTS"
      env:
        BEFORE_SHA: ${{ github.event.before }}
        NUGET_FEED_URL: ${{ env.nugetFeedUrl }}
        NUGET_PROJECTS: ${{ env.nugetProjects }}
        NUGET_API_KEY: ${{steps.login.outputs.NUGET_API_KEY}}
      