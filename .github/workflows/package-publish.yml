name: Package Publish

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  id-token: write
  contents: read
  pull-requests: read
  
env:  
  nugetFeedUrl: "https://api.nuget.org/v3/index.json"
  nugetProjects: |
    src/Niobium.Invoicing.Contracts

jobs:
  prod-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    concurrency:
      group: prod-release-publish
      cancel-in-progress: true
    env:
      buildVersion: '${{ vars.MAJOR_VERSION }}.${{ vars.MINOR_VERSION }}.${{ github.run_number }}'
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha }}

    - name: Identify changed package projects
      id: changes
      uses: actions/github-script@v8
      with:
        script: |
          const files = await github.paginate(github.rest.pulls.listFiles, {
            ...context.repo, pull_number: context.payload.pull_request.number, per_page: 100
          });
          core.setOutput('contracts', files.some(file => file.filename.startsWith('src/Niobium.Invoicing.Contracts/')));

    - name: Setup .NET
      if: steps.changes.outputs.contracts == 'true'
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x.x'

    - name: Restore Packages
      if: steps.changes.outputs.contracts == 'true'
      run: dotnet restore

    - name: Build Projects
      if: steps.changes.outputs.contracts == 'true'
      run: dotnet build --configuration Release /p:BUILD_BUILDNUMBER=${{ env.buildVersion }}
      
    - name: NuGet login (OIDC)
      if: steps.changes.outputs.contracts == 'true'
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    
    - name: NuGet Publish
      if: steps.changes.outputs.contracts == 'true'
      run: |
        set -euo pipefail

        while IFS= read -r project; do
          [[ -z "$project" ]] && continue

          echo "Publishing $project."
          dotnet nuget push "$project/bin/Release/*.nupkg" --source "$NUGET_FEED_URL" --api-key "$NUGET_API_KEY"
        done <<< "$NUGET_PROJECTS"
      env:
        NUGET_FEED_URL: ${{ env.nugetFeedUrl }}
        NUGET_PROJECTS: ${{ env.nugetProjects }}
        NUGET_API_KEY: ${{steps.login.outputs.NUGET_API_KEY}}
