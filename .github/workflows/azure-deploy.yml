name: Azure Deployment

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

env:
  buildVersion: '${{ vars.MAJOR_VERSION }}.${{ vars.MINOR_VERSION }}.${{ github.run_number }}'
  SourceRevisionId: '${{ github.event.pull_request.merge_commit_sha || github.sha }}'

jobs:
  verify:
    name: Build and local tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.35.0
        ports:
          - 10002:10002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore
        run: |
          dotnet restore Niobium.Invoicing.slnx --nologo
          dotnet restore src/Niobium.Invoicing.Deployment.Tests/Niobium.Invoicing.Deployment.Tests.csproj --nologo
      - name: Build
        run: |
          dotnet build Niobium.Invoicing.slnx --configuration Release --no-restore --nologo
          dotnet build src/Niobium.Invoicing.Deployment.Tests/Niobium.Invoicing.Deployment.Tests.csproj --configuration Release --no-restore --nologo
      - name: Delivery policy tests
        run: |
          node --test scripts/delivery-policy.test.cjs
          python -m unittest discover -s scripts -p "test_*.py"
      - name: Unit tests with coverage
        run: dotnet test --project src/Niobium.Invoicing.Core.Tests/Niobium.Invoicing.Core.Tests.csproj --configuration Release --no-build --no-restore --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --results-directory artifacts/unit
      - name: Local integration tests with coverage
        env:
          NIOBIUM_INVOICING_TEST_TABLE_ENDPOINT: 'http://127.0.0.1:10002/devstoreaccount1'
        run: dotnet test --project src/Niobium.Invoicing.Integration.Tests/Niobium.Invoicing.Integration.Tests.csproj --configuration Release --no-build --no-restore --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --results-directory artifacts/local-integration
      - name: Check application coverage
        run: python scripts/check-coverage.py artifacts/unit/coverage.cobertura.xml artifacts/local-integration/coverage.cobertura.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-test-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  test:
    name: Deploy test and run integration
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      id-token: write
    concurrency:
      # Keep deployment and its tests under the SAME lock, including across feature branches.
      group: test-deploy
      cancel-in-progress: false
    env:
      AZURE_ENV_NAME: test
      APP_SHORT_NAME: niobiuminvoicing
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      SERVICE_BUS_QUEUE_NAMES: 'issueinvoicecommand'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x.x'
      - uses: Azure/setup-azd@v2
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: azd login
        run: azd auth login --federated-credential-provider github --client-id ${{ secrets.AZURE_CLIENT_ID }} --tenant-id ${{ secrets.AZURE_TENANT_ID }}
      - name: Load existing test signing configuration
        run: python scripts/test-resources.py configure
      - name: Publish
        env:
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_ENV_NAME: 'test'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          IS_INTERACTIVE_DEPLOYER: false
          CUSTOM_DOMAIN_NAME: ${{ secrets.CUSTOM_DOMAIN_NAME }}
          APPSETTING_SERVICE_NAME: 'Niobium.Invoicing.Server.Test'
          APPSETTING_SERVICE_VERSION: '${{ env.buildVersion }}-prerelease'
          APPSETTING_BILLINGOPTIONS__GETINVOICEENDPOINT: 'https://staging.api.invoicing.niobium.co.nz'
          APPSETTING_IDENTITYSERVICEOPTIONS__ACCESSTOKENAUDIENCE: 'Niobium.Invoicing.Client.Test'
          APPSETTING_IDENTITYSERVICEOPTIONS__ACCESSTOKENISSUER: 'Niobium.Invoicing.Server.Test'
          APPSETTING_IDENTITYSERVICEOPTIONS__IDTOKENAUDIENCE: '95b52e52-dc79-4ac0-a53f-1acb10238888'
          APPSETTING_IDENTITYSERVICEOPTIONS__IDTOKENPUBLICKEY: '-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----'
          APPSETTING_PROFILEOPTIONS__PROFILEAPPID: 'e514f381-77cd-4ce9-ab6c-1a960fc7d9ed'
          APPSETTING_PROFILEOPTIONS__PROFILESERVICEHOST: 'https://api.identity.niobium.co.nz'
          APPSETTING_NOTIFICATIONQUEUEOPTIONS__FULLYQUALIFIEDNAMESPACE: 'niobiumnotify-sb-test.servicebus.windows.net'
          APPSETTING_BILLINGOPTIONS__INVOICETOKENSECRETSALT: '1234567890'
        run: |
          azd package --no-prompt
          azd provision --no-state --no-prompt
          azd deploy --no-prompt
      - name: Prepare deployed integration credentials
        run: python scripts/test-resources.py credentials
      - name: Run deployed integration tests
        timeout-minutes: 10
        env:
          TEST_INVOICE_BILLER: ${{ vars.TEST_INVOICE_BILLER }}
          TEST_INVOICE_ID: ${{ vars.TEST_INVOICE_ID }}
          TEST_NOTIFICATION_RECIPIENT: ${{ secrets.TEST_NOTIFICATION_RECIPIENT }}
          TEST_TOKEN_ISSUER: Niobium.Invoicing.Server.Test
          TEST_TOKEN_AUDIENCE: Niobium.Invoicing.Client.Test
        run: dotnet test --project src/Niobium.Invoicing.Deployment.Tests/Niobium.Invoicing.Deployment.Tests.csproj --configuration Release --report-trx --results-directory artifacts/deployed
      - name: Report generated test fixture identifiers
        if: always()
        run: |
          python - <<'PYREPORT'
          import json
          from pathlib import Path
          path = Path('artifacts/deployed/test-invoice-fixture.json')
          if path.exists():
              fixture = json.loads(path.read_text())
              print('TEST_INVOICE_BILLER=' + fixture['biller'])
              print('TEST_INVOICE_ID=' + str(fixture['invoice']))
          PYREPORT
      - name: Upload deployed test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-test-evidence-${{ github.sha }}
          path: artifacts/deployed/
          if-no-files-found: error

  open-pr:
    name: Open PR after test success
    if: github.event_name == 'push'
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            await require('./scripts/delivery-policy.cjs').openPullRequest({github, context, core});

  prod:
    name: Deploy production and run read-only integration
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
        
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x.x'

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: azd login
        run: azd auth login --federated-credential-provider github --client-id ${{ secrets.AZURE_CLIENT_ID }} --tenant-id ${{ secrets.AZURE_TENANT_ID }}

      - name: Publish
        env:
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_ENV_NAME: 'prod'
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CUSTOM_DOMAIN_NAME: ${{ secrets.CUSTOM_DOMAIN_NAME }}
          IS_INTERACTIVE_DEPLOYER: false
          APPSETTING_SERVICE_NAME: 'Niobium.Invoicing.Server.Prod'
          APPSETTING_SERVICE_VERSION: ${{ env.buildVersion }}
          APPSETTING_BILLINGOPTIONS__GETINVOICEENDPOINT: 'https://api.invoicing.niobium.co.nz'
          APPSETTING_IDENTITYSERVICEOPTIONS__ACCESSTOKENAUDIENCE: 'Niobium.Invoicing.Client.Prod'
          APPSETTING_IDENTITYSERVICEOPTIONS__ACCESSTOKENISSUER: 'Niobium.Invoicing.Server.Prod'
          APPSETTING_IDENTITYSERVICEOPTIONS__IDTOKENAUDIENCE: '95b52e52-dc79-4ac0-a53f-1acb10238888'
          APPSETTING_IDENTITYSERVICEOPTIONS__IDTOKENPUBLICKEY: '-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----'
          APPSETTING_PROFILEOPTIONS__PROFILEAPPID: 'e514f381-77cd-4ce9-ab6c-1a960fc7d9ed'
          APPSETTING_PROFILEOPTIONS__PROFILESERVICEHOST: 'https://api.identity.niobium.co.nz'
          APPSETTING_NOTIFICATIONQUEUEOPTIONS__FULLYQUALIFIEDNAMESPACE: 'niobiumnotify-sb-prod.servicebus.windows.net'
          APPSETTING_KV_BILLINGOPTIONS__INVOICETOKENSECRETSALT: ${{ secrets.APPSETTING_BILLINGOPTIONS__INVOICETOKENSECRETSALT }}
          APPSETTING_KV_IDENTITYSERVICEOPTIONS__ACCESSTOKENSECRET: ${{ secrets.APPSETTING_IDENTITYSERVICEOPTIONS__ACCESSTOKENSECRET }}
          APPSETTING_KV_RESENDSERVICEOPTIONS__GLOBALAPIKEY: ${{ secrets.APPSETTING_RESENDSERVICEOPTIONS__GLOBALAPIKEY }}
          APPSETTING_KV_STORAGETABLEOPTIONS__KEY: ${{ secrets.APPSETTING_STORAGETABLEOPTIONS__KEY }}
        run: |
          azd package --no-prompt
          azd provision --no-state --no-prompt
          azd deploy --no-prompt
      - name: Run production read-only integration tests
        timeout-minutes: 5
        env:
          READONLY_API_URL: https://api.invoicing.niobium.co.nz
          READONLY_EXPECTED_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          READONLY_INVOICE_BILLER_ID: ${{ vars.TEST_INVOICE_BILLER }}
          READONLY_INVOICE_ID: ${{ vars.TEST_INVOICE_ID }}
          READONLY_INVOICE_TOKEN: ${{ secrets.TEST_INVOICE_TOKEN }}
        run: python scripts/read-only-deployment.py --require-fixture --report artifacts/production-read-only.json
      - name: Upload production read-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-read-only-evidence-${{ github.event.pull_request.merge_commit_sha }}
          path: artifacts/production-read-only.json
          if-no-files-found: error
